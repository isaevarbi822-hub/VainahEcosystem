plugins { id 'com.android.application' }

def messengerVariant = (project.findProperty('VAINAH_MESSENGER') ?: 'false').toString().equalsIgnoreCase('true')

def signingStorePath = System.getenv('VAINAH_ANDROID_SIGNING_STORE')
def signingStorePassword = System.getenv('VAINAH_ANDROID_SIGNING_STORE_PASSWORD')
def signingAlias = System.getenv('VAINAH_ANDROID_SIGNING_KEY_ALIAS')
def signingKeyPassword = System.getenv('VAINAH_ANDROID_SIGNING_KEY_PASSWORD')
def officialSigning = signingStorePath && signingStorePassword && signingAlias && signingKeyPassword

android {
    namespace 'no.vainah.ecosystem'
    compileSdk 36

    defaultConfig {
        applicationId messengerVariant ? 'no.vainah.messenger' : 'no.vainah.ecosystem'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '0.10.1'
        def siteUrl = (project.findProperty('VAINAH_BASE_URL') ?: 'http://127.0.0.1:8000').toString()
        if (!(siteUrl.startsWith('https://') || siteUrl == 'http://127.0.0.1:8000')) {
            throw new GradleException('Use HTTPS for production or the USB localhost developer URL')
        }
        buildConfigField 'String', 'VAINAH_BASE_URL', '"' + siteUrl + '"'
        def googleClientId = (project.findProperty('VAINAH_GOOGLE_WEB_CLIENT_ID') ?: '').toString().trim()
        buildConfigField 'boolean', 'VAINAH_NATIVE_MESSENGER', messengerVariant ? 'true' : 'false'
        buildConfigField 'String', 'VAINAH_GOOGLE_WEB_CLIENT_ID', '"' + googleClientId.replace('\\', '\\\\').replace('"', '\\"') + '"'
        buildConfigField 'String', 'VAINAH_START_PATH', '"' + (messengerVariant ? '/app/messenger' : '/') + '"'
        manifestPlaceholders = [
            appLabel: messengerVariant ? 'Vainah Messenger' : 'Vainah Ecosystem',
            appIcon: messengerVariant ? '@drawable/messenger_icon' : '@drawable/icon'
        ]
    }

    signingConfigs {
        vainah {
            if (officialSigning) {
                storeFile file(signingStorePath)
                storePassword signingStorePassword
                keyAlias signingAlias
                // keytool created this PKCS12 keystore with one password for
                // both the store and private key. Use that same password even
                // if the optional key-password GitHub secret differs.
                keyPassword signingStorePassword
            }
        }
    }
    buildTypes {
        debug {
            // Stable signing certificate is required to register Android
            // OAuth clients reliably across separate GitHub Actions runners.
            if (officialSigning) signingConfig signingConfigs.vainah
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core:1.16.0'
}
