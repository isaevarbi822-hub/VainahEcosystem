name: Build Vainah EXE and APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'requirements*.txt'
      - '.github/workflows/build-installers.yml'
permissions:
  contents: read
jobs:
  windows-exe:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packager
        run: python -m pip install -r requirements-desktop.txt "pyinstaller>=6.0,<8"
      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name Vainah-Ecosystem `
            --add-data "apps/web;apps/web" --collect-submodules services `
            --collect-submodules uvicorn --collect-all webview apps/desktop/run.py
          if (!(Test-Path dist/Vainah-Ecosystem.exe)) { throw "EXE not created" }
          if ((Get-Item dist/Vainah-Ecosystem.exe).Length -lt 1000000) { throw "EXE too small" }
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Vainah-Windows-EXE-v0.4.0
          path: dist/Vainah-Ecosystem.exe
          if-no-files-found: error
          retention-days: 14

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        env:
          VAINAH_URL: ${{ vars.VAINAH_BASE_URL }}
        run: |
          if [ -n "$VAINAH_URL" ]; then
            case "$VAINAH_URL" in
              https://*) ;;
              *) echo 'VAINAH_BASE_URL must start with https://'; exit 1 ;;
            esac
            gradle -p apps/android :app:assembleDebug "-PVAINAH_BASE_URL=$VAINAH_URL" --no-daemon
          else
            echo 'No GitHub variable VAINAH_BASE_URL configured; building local USB-debug APK.'
            gradle -p apps/android :app:assembleDebug --no-daemon
          fi
          test -s apps/android/app/build/outputs/apk/debug/app-debug.apk
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk Vainah-Android-v0.4.0-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vainah-Android-APK-v0.4.0
          path: Vainah-Android-v0.4.0-debug.apk
          if-no-files-found: error
          retention-days: 14
