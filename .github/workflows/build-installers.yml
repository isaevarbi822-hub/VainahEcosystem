name: Build Vainah EXE and APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'requirements*.txt'
      - '.github/workflows/build-installers.yml'
permissions:
  contents: read
jobs:
  windows-exe:
    name: Windows EXE (Ecosystem + Messenger)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-desktop.txt "pyinstaller>=6,<8"
      - name: Build Vainah Ecosystem
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name Vainah-Ecosystem `
            --icon "apps/desktop/icons/ecosystem.ico" --add-data "apps/web;apps/web" --collect-submodules services `
            --collect-submodules uvicorn --collect-all webview apps/desktop/run.py
      - name: Build standalone Messenger
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name Vainah-Messenger `
            --icon "apps/desktop/icons/messenger.ico" --add-data "apps/web;apps/web" --collect-submodules services `
            --collect-submodules uvicorn --collect-all webview apps/desktop/messenger.py
          if (!(Test-Path dist/Vainah-Messenger.exe)) { throw "Messenger EXE not created" }
          if (!(Test-Path dist/Vainah-Ecosystem.exe)) { throw "Ecosystem EXE not created" }
      - uses: actions/upload-artifact@v4
        with:
          name: Vainah-Windows-v0.7.0
          path: |
            dist/Vainah-Ecosystem.exe
            dist/Vainah-Messenger.exe
          retention-days: 14
          if-no-files-found: error
  android-apk:
    name: Android APK (Ecosystem + Messenger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build both APK variants
        env:
          VAINAH_URL: ${{ vars.VAINAH_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [ -n "$VAINAH_URL" ]; then
            case "$VAINAH_URL" in
              https://*) extra+=("-PVAINAH_BASE_URL=$VAINAH_URL") ;;
              *) echo 'VAINAH_BASE_URL must be an HTTPS URL'; exit 1 ;;
            esac
          else
            echo 'VAINAH_BASE_URL missing: use adb reverse tcp:8000 tcp:8000 during local testing.'
          fi
          gradle -p apps/android :app:assembleDebug "${extra[@]}" --no-daemon
          test -s apps/android/app/build/outputs/apk/debug/app-debug.apk
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk Vainah-Ecosystem-v0.7.0-debug.apk
          gradle -p apps/android :app:assembleDebug "${extra[@]}" -PVAINAH_MESSENGER=true --rerun-tasks --no-daemon
          test -s apps/android/app/build/outputs/apk/debug/app-debug.apk
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk Vainah-Messenger-v0.7.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Vainah-Android-v0.7.0
          path: |
            Vainah-Ecosystem-v0.7.0-debug.apk
            Vainah-Messenger-v0.7.0-debug.apk
          retention-days: 14
          if-no-files-found: error
