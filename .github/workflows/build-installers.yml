name: Build Vainah EXE and APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'requirements*.txt'
      - '.github/workflows/build-installers.yml'
permissions:
  contents: read
jobs:
  api-tests:
    name: API and Messenger security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Validate Python source
        run: python -m compileall -q services
      - name: Run server tests
        env:
          ENVIRONMENT: development
        run: python -m pytest -q services/api/tests
  windows-exe:
    name: Windows EXE (Ecosystem + Messenger)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-desktop.txt "pyinstaller>=6,<8"
      - name: Build Vainah Ecosystem
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name Vainah-Ecosystem `
            --icon "apps/desktop/icons/ecosystem.ico" --add-data "apps/web;apps/web" --collect-submodules services `
            --collect-submodules uvicorn --collect-all webview apps/desktop/run.py
      - name: Build standalone Messenger
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name Vainah-Messenger `
            --icon "apps/desktop/icons/messenger.ico" --add-data "apps/web;apps/web" --collect-submodules services `
            --collect-submodules uvicorn --collect-all webview apps/desktop/messenger.py
          if (!(Test-Path dist/Vainah-Messenger.exe)) { throw "Messenger EXE not created" }
          if (!(Test-Path dist/Vainah-Ecosystem.exe)) { throw "Ecosystem EXE not created" }
      - uses: actions/upload-artifact@v4
        with:
          name: Vainah-Windows-v0.8.0
          path: |
            dist/Vainah-Ecosystem.exe
            dist/Vainah-Messenger.exe
          retention-days: 14
          if-no-files-found: error
  android-apk:
    name: Android APK (Ecosystem + Messenger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest includes Android cmdline tools. setup-android@v3 currently
      # invokes "sdkmanager tools", a removed package, and fails before Gradle.
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          # GitHub runner has sdkmanager under a versioned cmdline-tools folder,
          # but recent ubuntu-latest images no longer put it in PATH.
          manager="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -Vr | head -n 1)"
          if [ -z "${manager}" ]; then
            echo 'Android SDK command-line tools missing on runner'
            exit 1
          fi
          echo "Using ${manager}"
          echo "$(dirname "${manager}")" >> "${GITHUB_PATH}"
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Show Android toolchain
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed
      - name: Build both APK variants
        env:
          VAINAH_URL: ${{ vars.VAINAH_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-ci-logs
          extra=()
          if [ -n "${VAINAH_URL}" ]; then
            case "${VAINAH_URL}" in
              https://*) extra+=("-PVAINAH_BASE_URL=${VAINAH_URL}") ;;
              *) echo 'VAINAH_BASE_URL must be an HTTPS URL'; exit 1 ;;
            esac
          else
            echo 'VAINAH_BASE_URL missing: local debugging requires adb reverse tcp:8000 tcp:8000.'
          fi
          echo '::group::Build Vainah Ecosystem'
          gradle -p apps/android :app:assembleDebug "${extra[@]}" --stacktrace --warning-mode all --no-daemon 2>&1 | tee android-ci-logs/ecosystem.log
          echo '::endgroup::'
          test -s apps/android/app/build/outputs/apk/debug/app-debug.apk
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk Vainah-Ecosystem-v0.8.0-debug.apk
          echo '::group::Build Vainah Messenger'
          gradle -p apps/android :app:assembleDebug "${extra[@]}" -PVAINAH_MESSENGER=true --rerun-tasks --stacktrace --warning-mode all --no-daemon 2>&1 | tee android-ci-logs/messenger.log
          echo '::endgroup::'
          test -s apps/android/app/build/outputs/apk/debug/app-debug.apk
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk Vainah-Messenger-v0.8.0-debug.apk
      - name: Upload Android diagnostics even when build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vainah-Android-build-diagnostics
          path: |
            android-ci-logs/
            apps/android/app/build/reports/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Vainah-Android-v0.8.0
          path: |
            Vainah-Ecosystem-v0.8.0-debug.apk
            Vainah-Messenger-v0.8.0-debug.apk
          retention-days: 14
          if-no-files-found: error
